name: Build SegmentScraper desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and verify ffprobe
        run: npm run setup:media

      - name: Build Windows installers
        run: npm run dist:win

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*-Setup.exe \
            dist/*-Portable.exe \
            --title "SegmentScraper $GITHUB_REF_NAME" \
            --generate-notes
