<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SegmentScraper player UI checks</title>
<style>
  body { background:#141820; color:#eee; font:16px system-ui; margin:24px; }
  button,select { font:inherit; padding:8px 12px; margin:4px; }
  #player { position:relative; background:linear-gradient(120deg,#172438,#293447); height:420px; border-radius:12px; margin-top:20px; }
  #player:fullscreen { height:100vh; width:100vw; }
  #controls { position:absolute; bottom:18px; left:20px; right:20px; display:flex; align-items:center; }
  #controls button { color:white; background:transparent; border:0; }
  #timeline { position:absolute; bottom:82px; left:20px; right:20px; height:4px; background:#aaa; }
  #results { white-space:pre-wrap; color:#a9dfbf; }
  .fn81nbv, .lowerControls-nruDSV { display:flex; align-items:center; gap:16px; width:100%; }
  .f1mgyl9u { display:block; }
  #controls .f13imzm1 { width:48px; height:48px; padding:12px; margin:0; }
  #controls .f1kwmyva { width:90px; height:90px; background:#444; border-radius:50%; }
  .centerControls-ki4PEW { margin:auto; }
  #controls .playbackButton-W7fOEa { width:48px; height:48px; padding:12px; margin:0; vertical-align:middle; }
  .root-aPp5XA { display:block; width:24px; height:24px; }
  .GrUSCDgpInViNyFf, .KaHKA4FGlqZNemJ6 { display:flex; align-items:center; gap:12px; }
  .GrUSCDgpInViNyFf { width:100%; }
  .Ty3yu3IegFo92Lzr { flex:1; }
  #controls .g4VwZQnNKdUJnqyU { width:48px; height:48px; padding:12px; margin:0; }
  .GhaCLI__5ZvbgF5Z { width:24px; height:24px; }
  .netflix-controls-row { display:flex; align-items:center; margin-left:auto; }
  .netflix-control-box { flex:0 0 48px; width:48px; height:48px; }
  #controls .netflix-control-box button { width:48px; height:48px; margin:0; padding:0; }
  .KaHKA4FGlqZNemJ6 { width:108px; flex:0 0 108px; }
  /* Reproduce hostile provider styles and a fixed native utility-group width. */
  #controls button { color:black; }
  #controls svg rect { fill:black!important; stroke:black!important; }
</style>
<h1>Player UI checks</h1>
<p>Local fixtures only. No streaming requests or submissions are made.</p>
<label>Provider <select id="provider"><option>netflix</option><option>prime-video</option><option>videoland</option><option>skyshowtime</option><option>crunchyroll</option></select></label>
<button id="rerender">Rerender controls</button><button id="remove">Remove controls</button><button id="hide">Toggle controls visibility</button>
<button id="fullscreen">Toggle fullscreen</button><button id="preview">Preview sample JSON</button>
<pre id="results"></pre>
<div id="player"><video style="position:absolute;width:100%;height:100%"></video><div id="timeline" role="slider" aria-label="Playback position" aria-valuenow="30"></div><div id="controls"></div></div>
<script type="module">
import { state } from '/src/core/state.js';
import { providerControlFixtures } from '/benchmark/provider-control-fixtures.js';
import { injectBtn, getNextEpBtn } from '/src/ui/button.js';
import { setProviderName, closePanel, openPanel, showExportPreview } from '/src/ui/panel.js';
const provider = document.getElementById('provider');
const player = document.getElementById('player');
const controls = document.getElementById('controls');
const results = document.getElementById('results');
const sample = { imdb_id:'tt1234567', media_type:'movie', segment_type:'outro', start_sec:5400, end_sec:5600 };
state.allItems = [sample]; state.showIds.add('sample'); state.showTitle = 'Example Movie'; state.mediaType = 'movie'; state.imdbId = sample.imdb_id;
window.nfePanelCallbacks = { onClose:closePanel, onExport:preview, onSubmit:() => {}, onClear:() => {} };
function preview() { showExportPreview({ items:[sample], fileCount:1, duplicateCount:0, onConfirm:() => {} }); }
function anchorFor(name) {
  const button = document.createElement('button');
  button.textContent = 'Fullscreen';
  if (name === 'netflix') button.dataset.uia = 'control-fullscreen-enter';
  else if (name === 'prime-video') button.className = 'atvwebplayersdk-fullscreen-button';
  else if (name === 'videoland') button.className = 'vjs-fullscreen-control';
  else button.dataset.testid = 'fullscreen-button';
  button.onclick = () => player.requestFullscreen();
  return button;
}
function mount(name) {
  document.getElementById('nfe-panel')?.remove(); state.panelVisible = false;
  setProviderName(name);
  controls.replaceChildren(); controls.style.opacity = '1';
  const play = document.createElement('button'); play.textContent = 'Play / pause';
  controls.append(play, anchorFor(name));
  if (providerControlFixtures[name]) controls.innerHTML = providerControlFixtures[name];
  injectBtn(name);
}
const checks = [];
function check(condition, label) { if (!condition) throw new Error(label); checks.push('PASS ' + label); }
for (const name of [...provider.options].map(option => option.value)) {
  controls.replaceChildren(); injectBtn(name);
  check(!document.getElementById('nfe-btn'), name + ': no floating icon without controls');
  mount(name);
  check(controls.contains(document.getElementById('nfe-btn')), name + ': icon appears inside controls');
  const mountedButton = document.getElementById('nfe-btn');
  controls.style.display = 'none'; injectBtn(name);
  check(document.getElementById('nfe-btn') === mountedButton, name + ': hiding controls preserves the mounted button');
  controls.style.display = ''; injectBtn(name);
  check(document.getElementById('nfe-btn') === mountedButton, name + ': showing controls restores the same button');
  if (providerControlFixtures[name]) {
    const nativeBox = getNextEpBtn(name).getBoundingClientRect();
    const iconBox = mountedButton.getBoundingClientRect();
    check(Math.abs(nativeBox.top + nativeBox.height / 2 - iconBox.top - iconBox.height / 2) < 1, name + ': button is vertically aligned with native controls');
    check(Math.abs(nativeBox.height - iconBox.height) < 1, name + ': button uses native control height');
  }
  if (name === 'prime-video') {
    check(mountedButton.parentElement.parentElement === controls.querySelector('#atvwebplayersdk-skip-backward-button').parentElement.parentElement, 'Prime: separate native wrapper in the row');
  }
  if (name === 'skyshowtime') {
    check(mountedButton.parentElement.previousElementSibling === controls.querySelector('[data-testid="language-settings-button"]'), 'SkyShowtime: immediately right of subtitles');
  }
  if (name === 'videoland') {
    check(mountedButton.parentElement.nextElementSibling === controls.querySelector('#volume-bar-control').parentElement.parentElement, 'Videoland: own slot before the fixed bottom utility group');
    check(!mountedButton.closest('[role="slider"]'), 'Videoland: outside both seek and volume sliders');
  }
  const icon = mountedButton.querySelector('span').shadowRoot.querySelector('svg');
  check(getComputedStyle(icon.querySelector('rect')).fill === 'none' && getComputedStyle(icon.querySelector('rect')).stroke === 'rgb(255, 255, 255)', name + ': original white outline survives provider SVG rules');
  check(icon.getBoundingClientRect().width === 28, name + ': readable 28px logo');
  for (const width of ['640px', '100%']) {
    player.style.width = width;
    injectBtn(name);
    const own = mountedButton.getBoundingClientRect();
    check([...controls.querySelectorAll('button:not(#nfe-btn)')].every(control => {
      const box = control.getBoundingClientRect();
      return own.right <= box.left || own.left >= box.right || own.bottom <= box.top || own.top >= box.bottom;
    }), name + ': no native control overlap at ' + width);
  }
  player.style.width = '';
  mount(name);
  check(document.querySelectorAll('#nfe-btn').length === 1, name + ': rerender keeps exactly one button');
  check(!document.getElementById('timeline').contains(document.getElementById('nfe-btn')), name + ': timeline stays clear');
}
mount('netflix'); results.textContent = checks.length + ' checks passed\n' + checks.join('\n');
if (new URLSearchParams(location.search).has('panel')) openPanel();
provider.onchange = () => mount(provider.value);
document.getElementById('rerender').onclick = () => mount(provider.value);
document.getElementById('remove').onclick = () => { controls.replaceChildren(); injectBtn(provider.value); };
document.getElementById('hide').onclick = () => { controls.style.opacity = controls.style.opacity === '0' ? '1' : '0'; };
document.getElementById('fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : player.requestFullscreen();
document.getElementById('preview').onclick = preview;
document.addEventListener('fullscreenchange', () => {
  injectBtn(provider.value);
  for (const id of ['nfe-panel','nfe-export-preview']) {
    const element = document.getElementById(id);
    if (element) (document.fullscreenElement || document.body).appendChild(element);
  }
});
</script>
</html>
